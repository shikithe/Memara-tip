services:
  kvoter:
    build:
      context: ..
      dockerfile: kvoter/Dockerfile
    environment:
      THE_ODDS_API_KEY: ${THE_ODDS_API_KEY:-}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ../shared:/shared
    command: ["--feed","/shared/agent/history-h2h.json","--output","/shared/kvoter/odds.json"]
