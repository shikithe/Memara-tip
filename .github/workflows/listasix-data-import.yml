name: MemaraSix import ListaSix data
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: memarasix-listasix-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and validate active odds and full history
        run: python3 listasix_import.py
      - name: Save separate ListaSix data without touching tickets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f listasix-data/active-list.json listasix-data/history-h2h.json
          if ! git diff --cached --quiet; then
            git commit -m "Import validated ListaSix data [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
