name: MemaraSix live scores (5-minute checks)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/memarasix-live-scores.yml'
      - 'sync_live_scores.py'
      - 'index.html'
      - 'settle_virtual_tickets.py'
      - 'tests/test_virtual_settlement.py'
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: write
concurrency:
  group: memarasix-live-results
  cancel-in-progress: false
jobs:
  live-results:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test safe repeatable settlement
        run: python -m unittest discover -s tests -p test_virtual_settlement.py -v
      - name: Collect score states safely
        run: python sync_live_scores.py
      - name: Settle winning tickets at irreversible hit or final score
        run: python settle_virtual_tickets.py
      - name: Save live results and one-time bank settlement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-scores.json data.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh scores and settle irreversibly won or finished tickets [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
