name: MemaraSix live scores (5-minute checks)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: memarasix-live-results
  cancel-in-progress: false
jobs:
  live-results:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect score states safely
        run: python sync_live_scores.py
      - name: Save display-only results (never tickets or bank)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-scores.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh live scores [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
