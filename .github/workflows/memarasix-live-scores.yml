name: MemaraSix live scores (5-minute checks)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/memarasix-live-scores.yml'
      - 'sync_live_scores.py'
      - 'football_identity.py'
      - 'nba_live_points.py'
      - 'tests/test_nba_live_points.py'
      - 'index.html'
      - 'settle_virtual_tickets.py'
      - 'tests/test_virtual_settlement.py'
      - 'tests/test_football_live_scores.py'
      - 'memarasix_daily_rollover.py'
      - 'tests/test_archive_handoff.py'
  schedule:
    # Primary periodic check, UTC (same five-minute frequency in Sarajevo)
    - cron: '*/5 * * * *'
    # Offset fallback if GitHub queues or drops primary scheduled checks
    - cron: '2-59/15 * * * *'
    # Low-frequency after-game finalization backups (GitHub may drop burst schedules).
    # 03:17-07:17 UTC covers completed US-night NBA games and guarantees a
    # separate independent opportunity to settle before Sarajevo morning review.
    - cron: '17 3-7 * * *'
permissions:
  contents: write
concurrency:
  group: memarasix-live-results
  cancel-in-progress: false
jobs:
  live-results:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test safe repeatable settlement
        run: |
          python -m unittest discover -s tests -p test_virtual_settlement.py -v
          python -m unittest discover -s tests -p test_football_live_scores.py -v
          python -m unittest discover -s tests -p test_nba_live_points.py -v
          python -m unittest discover -s tests -p test_archive_handoff.py -v
      - name: Collect score states safely
        run: python sync_live_scores.py
      - name: Settle winning tickets at irreversible hit or final score
        run: python settle_virtual_tickets.py
      - name: Archive only when all individual legs (including DNP) are final
        run: python memarasix_daily_rollover.py
      - name: Save live results, final bank and archive together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-scores.json data.json archive.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh scores and settle irreversibly won or finished tickets [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
