name: MemaraSix free NBA statistics
on:
  workflow_dispatch:
  schedule:
    # 13:10 Sarajevo, AFTER player-points odds collection (~12:35 local).
    - cron: '10 11,12 * * *'
  push:
    paths:
      - '.github/workflows/memarasix-nba-free.yml'
      - 'sync_nba_free.py'
permissions:
  contents: write
concurrency:
  group: memarasix-free-nba
  cancel-in-progress: false
jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no paid API is required
        run: python -m py_compile sync_nba_free.py
      - name: Run only at Sarajevo scheduled hour or manually
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$(TZ=Europe/Sarajevo date +%H)" != "13" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch recent free NBA box scores
        if: steps.gate.outputs.run == 'true'
        run: python sync_nba_free.py --days 14 --max-summaries 40
      - name: Validate and save research-only file
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('collector-output/nba-free-statistics.json'))
          assert d['no_api_key_required'] and d['provider']=='espn-public-unofficial'
          assert d['target_source']=='the-odds-api-player-points'
          assert all(p['not_a_projection'] for p in d['players'])
          print('Players with statistics',d['players_with_stats'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector-output/nba-free-statistics.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh free NBA statistics research [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: memarasix-nba-free-research
          path: collector-output/nba-free-statistics.json
          if-no-files-found: ignore
