name: SAFE A/B sequential single-ticket approval regression
on:
  push:
    branches: [fix/ab-independent-approval-regression-20261127]
    paths:
      - test_memarasix_espn_ab_publish.py
      - memarasix_espn_ab_publish.py
      - .github/workflows/ab-independent-approval-branch-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest -v test_memarasix_espn_ab_publish.py
      - run: echo "A_B_SINGLE_APPROVAL_REGRESSION_OK - no approval or data.json changed"
