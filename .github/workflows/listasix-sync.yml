name: Sync ListaSix data on verified ready event
on:
  workflow_dispatch:
  repository_dispatch:
    types: [listasix-active-list-ready]
# No scheduled polling: ListaSix signals this workflow after successful commit.
# ListaSix retries until MemaraSix confirms the received exact digest.
permissions:
  contents: write
concurrency:
  group: listasix-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and validate same-day ListaSix snapshot and event digest
        env:
          SOURCE_DATE: ${{ github.event.client_payload.date }}
          SOURCE_SHA256: ${{ github.event.client_payload.active_sha256 }}
        run: |
          set -euo pipefail
          python3 memarasix_sync_listasix.py \
            --expected-date "$SOURCE_DATE" \
            --expected-sha256 "$SOURCE_SHA256"
      - name: Commit synchronized active list, history and receipt together
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- listasix-data/active-list.json listasix-data/history-h2h.json listasix-data/sync-receipt.json
          if git diff --cached --quiet; then
            echo "LISTASIX_ALREADY_SYNCED"
            exit 0
          fi
          git commit -m "Sync confirmed ListaSix ready list [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "LISTASIX_SYNC_COMMITTED_AND_RECEIPT_PUBLISHED"
