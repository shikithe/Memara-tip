name: Sync ListaSix data
on:
  workflow_dispatch:
  schedule:
    - cron: '20,40 8 * * *'
    - cron: '0 9,10 * * *'
permissions:
  contents: write
concurrency:
  group: listasix-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate ListaSix data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p listasix-data
          python3 - <<'PY'
          import json, urllib.request, pathlib, datetime
          base="https://raw.githubusercontent.com/shikithe/Slavojka/HEAD/"
          files={"shared/active-list.json":"listasix-data/active-list.json","shared/agent/history-h2h.json":"listasix-data/history-h2h.json"}
          today=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=1))).date().isoformat()
          for source,target in files.items():
              try:
                  with urllib.request.urlopen(base+source, timeout=25) as r:
                      content=r.read().decode("utf-8")
                  obj=json.loads(content)
                  if not obj:
                      raise ValueError("empty JSON data")
                  if source.endswith("active-list.json"):
                      if obj.get("date")!=today or not isinstance(obj.get("fixtures"),list) or not obj["fixtures"]:
                          raise ValueError("active list missing current date or fixtures")
                  else:
                      if not isinstance(obj,(dict,list)):
                          raise ValueError("unexpected history format")
                  pathlib.Path(target).write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n")
                  print("VALID",source,"->",target)
              except Exception as e:
                  print("UNAVAILABLE",source,repr(e))
                  if source.endswith("active-list.json"):
                      raise
                  # Never overwrite a previous valid history with empty or invalid content.
          PY
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listasix-data/
          if ! git diff --cached --quiet; then
            git commit -m "Sync validated ListaSix daily feed"
            git push
          fi
