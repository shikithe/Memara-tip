name: Sync ListaSix data on verified ready event
on:
  workflow_dispatch:
  repository_dispatch:
    types: [listasix-active-list-ready]
  schedule:
    # Temporary failover ONLY until the cross-repo dispatch token is verified.
    # Normal primary path is instant repository_dispatch after ListaSix commit.
    - cron: '20,40 8 * * *'
    - cron: '0 9,10 * * *'
    - cron: '55 12,13 * * *'
# Event is primary. Existing schedule is temporarily kept as failover to avoid
# interrupting MemaraSix before the cross-repository credential is configured.
permissions:
  contents: write
concurrency:
  group: memarasix-daily-publication
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and validate same-day ListaSix snapshot and event digest
        env:
          SOURCE_DATE: ${{ github.event.client_payload.date }}
          SOURCE_SHA256: ${{ github.event.client_payload.active_sha256 }}
        run: |
          set -euo pipefail
          python3 memarasix_sync_listasix.py \
            --expected-date "$SOURCE_DATE" \
            --expected-sha256 "$SOURCE_SHA256"
      - name: Commit synchronized active list, history and receipt together
        id: synchronized
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- listasix-data/active-list.json listasix-data/history-h2h.json listasix-data/sync-receipt.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "LISTASIX_ALREADY_SYNCED"
          else
            git commit -m "Sync confirmed ListaSix ready list [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "LISTASIX_SYNC_COMMITTED_AND_RECEIPT_PUBLISHED"
          fi
      - name: Decide if new data needs ticket analysis
        id: analysis_gate
        env:
          LIST_CHANGED: ${{ steps.synchronized.outputs.changed }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          day=datetime.now(ZoneInfo("Europe/Sarajevo")).date().isoformat()
          previous={}
          try:
              previous=json.loads(Path("memarasix-1455-approved.json").read_text())
          except (OSError,ValueError):
              pass
          analyze=(os.environ["LIST_CHANGED"]=="true" or
                   previous.get("date")!=day or not previous.get("tickets"))
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("analyze="+("true" if analyze else "false")+"\n")
          print("LISTASIX_RECEIPT_READY_ANALYZE", analyze)
          PY
      - name: Prepare A and B from synced ListaSix evidence
        if: steps.analysis_gate.outputs.analyze == 'true'
        run: |
          set -euo pipefail
          python3 -m unittest -q test_memarasix_verified_quotes.py
          python3 memarasix_auto_approval.py
          git add -- memarasix-1455-approved.json collector-output/automatic-ab-analysis.json
          if ! git diff --cached --quiet; then
            git commit -m "MemaraSix: prepare A/B after ListaSix receipt [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish only when it is noon or later and every match passes checks
        env:
          MEMARASIX_READY_SYNC_LATE: "1"
        run: |
          set -euo pipefail
          now="$(TZ=Europe/Sarajevo date +%H%M)"
          if [ "$now" -lt 1200 ]; then
            echo "LISTASIX_SYNC_ANALYSIS_DONE_PUBLICATION_AT_12"
            exit 0
          fi
          # The publisher owns the ONLY data.json write. After 12:30 it can
          # publish solely for a confirmed ready-sync event, with fresh odds,
          # unstarted fixtures and all usual verified ticket/10% bank gates.
          python3 memarasix_1455_publish.py
          git add -- data.json memarasix-1455-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "MemaraSix: late verified publication after ready data [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
