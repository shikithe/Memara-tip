name: Sync ListaSix data on verified ready event
on:
  workflow_dispatch:
  repository_dispatch:
    types: [listasix-active-list-ready]
  schedule:
    # Temporary failover ONLY until the cross-repo dispatch token is verified.
    # Normal primary path is instant repository_dispatch after ListaSix commit.
    - cron: '20,40 8 * * *'
    - cron: '0 9,10 * * *'
    - cron: '55 12,13 * * *'
# Event is primary. Existing schedule is temporarily kept as failover to avoid
# interrupting MemaraSix before the cross-repository credential is configured.
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: memarasix-daily-publication
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and validate same-day ListaSix snapshot and event digest
        env:
          SOURCE_DATE: ${{ github.event.client_payload.date }}
          SOURCE_SHA256: ${{ github.event.client_payload.active_sha256 }}
        run: |
          set -euo pipefail
          python3 memarasix_sync_listasix.py \
            --expected-date "$SOURCE_DATE" \
            --expected-sha256 "$SOURCE_SHA256"
      - name: Commit synchronized active list, history and receipt together
        id: synchronized
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- listasix-data/active-list.json listasix-data/history-h2h.json listasix-data/sync-receipt.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "LISTASIX_ALREADY_SYNCED"
          else
            git commit -m "Sync confirmed ListaSix ready list [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "LISTASIX_SYNC_COMMITTED_AND_RECEIPT_PUBLISHED"
          fi
      - name: Announce completed sync for independent AI review
        run: |
          echo "LISTASIX_SYNC_READY_FOR_AI_REVIEW"
          echo "The independent AI analyst is the SOLE writer of memarasix-1455-approved.json."
          echo "GitHub may sync fixtures and publish independently AI-approved tickets only."
      - name: Mark verified ListaSix snapshot ready for AI analyst
        run: |
          echo "AI_REVIEW_CAN_BEGIN_AFTER_CONFIRMED_SYNC"
          echo "Waiting for the independent ChatGPT AI task to analyze and commit memarasix-1455-approved.json."
          echo "Sync NEVER publishes tickets: approval commit triggers the publisher."
      - name: Create exactly one PR labelled listasix-ready per confirmed snapshot
        id: handoff
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 memarasix_ready_pr.py
      - name: Report whether the ChatGPT Work PR handoff was created
        if: always()
        run: |
          if [ "${{ steps.handoff.outcome }}" = "success" ]; then
            echo "LISTASIX_READY_PR_HANDOFF_PUBLISHED"
          else
            echo "::warning::READY_PR_CREATION_FAILED: Check GitHub Actions permission to create PRs. ChatGPT Work event task is configured separately."
          fi
