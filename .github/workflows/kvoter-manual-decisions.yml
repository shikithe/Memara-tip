name: Kvoter Manual owner decisions
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  apply:
    if: github.event.issue.user.login == 'shikithe' && (github.event.issue.title == 'KVOTER MATCH' || github.event.issue.title == 'KVOTER REJECT' || github.event.issue.title == 'KVOTER BATCH')
    runs-on: ubuntu-latest
    concurrency:
      group: kvoter-owner-decisions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collector-isolated-test-20261030
          persist-credentials: true
      - name: Read current public candidate evidence
        run: |
          git fetch origin main
          git show origin/main:kvoter/manual/manual-candidates.json > /tmp/manual-candidates.json
      - name: Validate owner decision and save isolated identity
        env:
          GH_EVENT_PATH: ${{ github.event_path }}
        run: python kvoter/apply_manual_decision.py "$GH_EVENT_PATH" /tmp/manual-candidates.json
      - name: Commit approved or rejected decision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- kvoter/manual/decisions.json kvoter/team-database.json
          if ! git diff --cached --quiet; then
            git commit -m "kvoter: save owner reviewed match decision [skip ci]"
            git pull --rebase origin collector-isolated-test-20261030
            git push origin HEAD:collector-isolated-test-20261030
          fi
      - name: Remove processed decisions from public Manual queue
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/kvoter-manual-after-approval origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          decisions=json.loads(Path('kvoter/manual/decisions.json').read_text()).get('decisions',[])
          approved_ids={d['fixture_id'] for d in decisions if d.get('decision')=='matched'}
          rejected={(d['fixture_id'],d['event_id']) for d in decisions if d.get('decision')=='rejected'}
          base=Path('/tmp/kvoter-manual-after-approval/kvoter/manual')
          p=base/'manual-candidates.json'
          data=json.loads(p.read_text())
          new=[]
          for f in data.get('fixtures',[]):
              fid=f['fixture_id']
              if fid in approved_ids:
                  continue
              f['candidates']=[c for c in f.get('candidates',[]) if (fid,c['event_id']) not in rejected]
              if f['candidates']:\n                  new.append(f)
          data['fixtures']=new
          data['total']=len(new)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\\n')
          u=base/'unmatched-fixtures.json'
          old=json.loads(u.read_text())
          visible={f['fixture_id'] for f in new}
          old['fixtures']=[f for f in old.get('fixtures',[]) if f['fixture_id'] in visible]
          old['total']=len(old['fixtures'])
          u.write_text(json.dumps(old,ensure_ascii=False,indent=2)+'\\n')
          print('KVOTER_MANUAL_REMAINING',len(new))
          PY
          cd /tmp/kvoter-manual-after-approval
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- kvoter/manual/manual-candidates.json kvoter/manual/unmatched-fixtures.json
          if ! git diff --cached --quiet; then
            git commit -m "kvoter manual: remove processed owner decisions [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Refresh offline Kvoter partitions
        if: github.event.issue.title != 'KVOTER REJECT'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kvoter-isolated-replay.yml --ref main
      - name: Close processed issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Kvoter decision recorded on isolated branch. Match replay requested when applicable."
