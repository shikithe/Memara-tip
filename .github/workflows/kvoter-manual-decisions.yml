name: Kvoter Manual owner decisions
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  apply:
    if: github.event.issue.user.login == 'shikithe' && (github.event.issue.title == 'KVOTER MATCH' || github.event.issue.title == 'KVOTER REJECT' || github.event.issue.title == 'KVOTER BATCH')
    runs-on: ubuntu-latest
    concurrency:
      group: kvoter-owner-decisions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collector-isolated-test-20261030
          persist-credentials: true
      - name: Read current public candidate evidence
        run: |
          git fetch origin main
          git show origin/main:kvoter/manual/manual-candidates.json > /tmp/manual-candidates.json
      - name: Validate owner decision and save isolated identity
        env:
          GH_EVENT_PATH: ${{ github.event_path }}
        run: python kvoter/apply_manual_decision.py "$GH_EVENT_PATH" /tmp/manual-candidates.json
      - name: Commit approved or rejected decision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- kvoter/manual/decisions.json kvoter/team-database.json
          if ! git diff --cached --quiet; then
            git commit -m "kvoter: save owner reviewed match decision [skip ci]"
            git pull --rebase origin collector-isolated-test-20261030
            git push origin HEAD:collector-isolated-test-20261030
          fi
      - name: Refresh offline Kvoter partitions
        if: github.event.issue.title != 'KVOTER REJECT'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kvoter-isolated-replay.yml --ref main
      - name: Close processed issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Kvoter decision recorded on isolated branch. Match replay requested when applicable."
