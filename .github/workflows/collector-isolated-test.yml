name: Collector isolated test (no publishing)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7,8 * * *'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sarajevo 09:00 schedule gate
        id: time_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          local_time="$(TZ=Europe/Sarajevo date +%H:%M)"
          echo "Sarajevo time: $local_time"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$local_time" = "09:00" ]; then
            echo "run_test=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_test=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC cron or delayed scheduled run."
          fi
      - name: Checkout isolated test branch (never main code)
        if: steps.time_gate.outputs.run_test == 'true'
        uses: actions/checkout@v4
        with:
          ref: collector-isolated-test-20261030
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.time_gate.outputs.run_test == 'true'
        with:
          python-version: '3.11'
      - name: Verify no-truncation unit tests
        if: steps.time_gate.outputs.run_test == 'true'
        run: python -m unittest -v test_collector_no_truncation.py
      - name: Collect rolling 23h59m ESPN fixtures to temporary directory
        if: steps.time_gate.outputs.run_test == 'true'
        run: |
          mkdir -p /tmp/memara-collector-test
          python collector/collector_24h.py --output /tmp/memara-collector-test/collector-raw.json
          python collector/memara_prepare_feed.py --input /tmp/memara-collector-test/collector-raw.json --output /tmp/memara-collector-test/collector-feed.json
          python memara_math.py --input /tmp/memara-collector-test/collector-feed.json --output /tmp/memara-collector-test/collector-feed.json
      - name: Validate time window and candidate output
        if: steps.time_gate.outputs.run_test == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          root=Path('/tmp/memara-collector-test')
          raw=json.loads((root/'collector-raw.json').read_text())
          feed=json.loads((root/'collector-feed.json').read_text())
          start=datetime.fromisoformat(raw['window_start_utc'])
          end=datetime.fromisoformat(raw['window_end_utc'])
          assert end-start==timedelta(hours=23,minutes=59), 'Wrong collection window'
          assert raw.get('fixture_count',0)>0, 'No fixtures returned'
          assert feed.get('date')==raw.get('date'), 'Feed date mismatch'
          assert all(start<=datetime.fromisoformat(f['start_utc'].replace('Z','+00:00'))<end for f in raw['fixtures']), 'Out-of-window fixture'
          raw_ids={f['id'] for f in raw['fixtures'] if f.get('status')=='pre' and (f.get('sport')=='football' or (f.get('sport')=='basketball' and f.get('league')=='nba'))}
          feed_ids={f['id'] for f in feed.get('football_candidates',[])+feed.get('nba_games',[])}
          missing=raw_ids-feed_ids
          extra=feed_ids-raw_ids
          print('Raw eligible:',len(raw_ids),'Feed:',len(feed_ids),'Missing:',len(missing),'Extra:',len(extra))
          assert not missing, f'Missing eligible fixtures: {sorted(missing)[:20]}'
          assert not extra, f'Unexpected fixtures: {sorted(extra)[:20]}'
          print('Raw fixtures:',raw['fixture_count'])
          print('Candidate counts:',feed.get('candidate_counts'))
          print('Source errors:',len(raw.get('errors',[])))
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.time_gate.outputs.run_test == 'true'
        with:
          name: isolated-collector-test
          path: /tmp/memara-collector-test/
          if-no-files-found: ignore
