name: MemaraSix C research screening
on:
  workflow_dispatch:
  schedule:
    - cron: '20 12,13 * * *'
permissions:
  contents: write
concurrency:
  group: memarasix-c-research
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Local time gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$(TZ=Europe/Sarajevo date +%H)" != "14" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: Screen C candidates
        if: steps.gate.outputs.run == 'true'
        run: python ticket_c_screening.py
      - name: Save research only
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector-output/ticket-c-research.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh C ticket research [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
