name: MemaraSix ESPN-only A/B regression tests
on:
  push:
    branches: [main]
    paths:
      - 'memarasix_espn_ab_publish.py'
      - 'test_memarasix_espn_ab_publish.py'
      - '.github/workflows/memarasix-espn-ab-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest -v test_memarasix_espn_ab_publish.py
