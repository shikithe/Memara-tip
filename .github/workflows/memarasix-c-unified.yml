name: MemaraSix unified NBA C preparation
on:
  workflow_dispatch:
  push:
    paths:
      - 'collector-output/nba-manual-trigger.txt'
  schedule:
    # Every ten minutes; local 12:00-14:59 Sarajevo gate controls execution.
    # Delayed/dropped GitHub schedule checks have further retry opportunities.
    - cron: '0,10,20,30,40,50 10-13 * * *'
permissions:
  contents: write
concurrency:
  group: memara-nba-24h
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Daily 12:00 Sarajevo gate (one list per local day)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,time,timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          sar=ZoneInfo("Europe/Sarajevo")
          local=datetime.now(sar)
          reason="ready"
          allowed=os.environ["EVENT_NAME"]=="workflow_dispatch" or (12<=local.hour<=14)
          # One-off push trigger only for the requested Sarajevo date.
          if os.environ["EVENT_NAME"]=="push":
              marker=Path("collector-output/nba-manual-trigger.txt")
              allowed=marker.exists() and marker.read_text(encoding="utf-8").strip()=="2026-11-16" and local.date().isoformat()=="2026-11-16"
          if not allowed:
              reason="before_noon_sarajevo"
          # Daily date deduplication, NOT a 3-hour freshness rule.
          # Do not collect a second scheduled list on the same Sarajevo day.
          if allowed and os.environ["EVENT_NAME"]=="schedule":
              try:
                  existing=json.loads(Path("collector-output/nba-next-24h.json").read_text(encoding="utf-8"))
                  stamp=datetime.fromisoformat(existing["collected_at_utc"].replace("Z","+00:00"))
                  if stamp.astimezone(sar).date()==local.date() and existing.get("status")=="ok":
                      allowed=False
                      reason="already_collected_today"
              except (ValueError,KeyError,OSError,TypeError):
                  pass
          print("NBA_DAILY_GATE",json.dumps({"date":local.date().isoformat(),"local":local.isoformat(),"allowed":allowed,"reason":reason}))
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              print("run="+str(allowed).lower(),file=output)
          PY
      - name: Check scripts and NBA quota guard regression
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile collector_nba_24h.py sync_nba_free.py sync_nba_points.py memara_enrich_nba_props.py ticket_c_screening.py
          python -m unittest -v test_nba_odds_quota.py
      - name: Clear and COMMIT old NBA offers, retry branch conflicts
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_nba_clear_before_collect.py -v
          python nba_clear_before_collect.py
          stamp="$(python nba_clear_before_collect.py --verify | awk '{print $2}')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- collector-output/nba-next-24h.json collector-output/nba-player-points.json collector-output/nba-analysis-ready.json collector-output/ticket-c-research.json collector-output/nba-free-statistics.json
          git commit -m "data: clear NBA before collecting [skip ci]"
          published=false
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              published=true
              break
            fi
            echo "NBA cleanup push conflict, attempt $attempt"
            sleep 5
          done
          if [ "$published" != true ]; then
            echo "::error::NBA cleanup could not be committed, collector blocked"
            exit 1
          fi
          git fetch origin main
          python nba_clear_before_collect.py --verify --ref origin/main --stamp "$stamp"
          echo "NBA_CLEARANCE_CONFIRMED=true"
      - name: Reconfirm clearance immediately before ESPN fetch
        if: steps.gate.outputs.run == 'true'
        run: |
          git fetch origin main
          python nba_clear_before_collect.py --verify --ref origin/main
      - name: Fetch upcoming NBA fixtures
        if: steps.gate.outputs.run == 'true'
        run: python collector_nba_24h.py --hours 24 --output collector-output/nba-next-24h.json
      - name: Validate the upcoming 24-hour player list
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          data=json.load(open("collector-output/nba-next-24h.json",encoding="utf-8"))
          start=datetime.fromisoformat(data["window_start_utc"])
          end=datetime.fromisoformat(data["window_end_utc"])
          assert 23.99<=(end-start).total_seconds()/3600<=24.01
          assert data["status"]=="ok" and data["publication_allowed"] is False
          assert data["game_count"]==len(data["games"])
          assert data["player_candidate_count"]==len(data["players"])
          assert all(start<=datetime.fromisoformat(g["start_utc"])<end for g in data["games"])
          assert all(p["participation"]=="unverified" and p["points_line"] is None for p in data["players"])
          print("NBA_24H_LIST",json.dumps({"games":data["game_count"],"roster_players":data["player_candidate_count"],"window_start_utc":data["window_start_utc"],"window_end_utc":data["window_end_utc"]}))
          PY
      - name: Save daily NBA games and rosters independently of bookmaker odds
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- collector-output/nba-next-24h.json
          if ! git diff --cached --quiet; then
            git commit -m "data: NBA next 24h noon roster snapshot [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Fetch bookmaker player points (optional; never blocks NBA list)
        id: odds
        if: steps.gate.outputs.run == 'true' && env.THE_ODDS_API_KEY != ''
        continue-on-error: true
        run: python sync_nba_points.py --region us
      - name: Check optional bookmaker offer count (no age check)
        id: odds_state
        if: steps.odds.outcome == 'success'
        run: |
          python - <<'PY'
          import json,os
          data=json.load(open("collector-output/nba-player-points.json",encoding="utf-8"))
          has_offers=bool(data.get("offers")) and data.get("offer_count")==len(data["offers"])
          print("NBA_BOOKMAKER_OFFERS",json.dumps({"has_offers":has_offers,"offers":len(data.get("offers",[]))}))
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              print("has_offers="+str(has_offers).lower(),file=out)
          PY
      - name: Fetch recent ESPN player statistics for current odds players
        if: steps.odds_state.outputs.has_offers == 'true'
        run: python sync_nba_free.py --days 14 --max-summaries 60
      - name: Merge eligible offers into current-day analyst feed
        if: steps.odds_state.outputs.has_offers == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          feed=Path("collector-feed.json")
          today=datetime.now(ZoneInfo("Europe/Sarajevo")).date().isoformat()
          if not feed.exists() or json.loads(feed.read_text(encoding="utf-8")).get("date")!=today:
              print("NBA_C_FEED_SKIPPED no_current_day_feed; independent NBA odds snapshot still saved")
          else:
              import subprocess
              subprocess.run(["python","memara_enrich_nba_props.py","--feed",str(feed),"--props","collector-output/nba-player-points.json","--output",str(feed)],check=True)
              subprocess.run(["python","memara_math.py","--input",str(feed),"--output",str(feed)],check=True)
          PY
      - name: Screen C candidates for research
        if: steps.odds_state.outputs.has_offers == 'true'
        run: python ticket_c_screening.py
      - name: Validate research-only output
        if: steps.odds_state.outputs.has_offers == 'true'
        run: |
          python - <<'PY'
          import json
          d=json.load(open("collector-output/ticket-c-research.json"))
          assert d["publication_allowed"] is False
          assert d["state"]=="research_only"
          print("C research candidates:",d["count"])
          PY
      - name: Save optional NBA player odds and analysis research
        if: steps.odds_state.outputs.has_offers == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- collector-output/nba-free-statistics.json collector-output/ticket-c-research.json collector-output/nba-player-points.json
          if [ -f collector-feed.json ]; then git add -- collector-feed.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: optional NBA C bookmaker and research snapshot [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report bookmaker quota separately from NBA fixture collection
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "NBA fixtures/rosters saved. Optional bookmaker step outcome: ${{ steps.odds.outcome }}"
