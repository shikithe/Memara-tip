name: MemaraSix event-driven ListaSix sync tests
on:
  pull_request:
    paths:
      - 'memarasix_sync_listasix.py'
      - 'tests/test_event_driven_listasix_sync.py'
      - '.github/workflows/listasix-sync.yml'
      - '.github/workflows/listasix-event-sync-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-sync-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -p 'test_event_driven_listasix_sync.py' -v
