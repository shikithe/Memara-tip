name: MEMARA BetSharp NBA daily player points
on:
  workflow_dispatch:
  push:
    paths:
      - 'collector-output/betsharp-trigger.txt'
  schedule:
    # 11:45 local: clear -> verified feedback -> collect; noon retries.
    - cron: '45 9,10 * * *'
    - cron: '0,5,25,45 10,11 * * *'
    # Recovery checks after preparation window; same capture serves C and NBA 10.
    - cron: '10 12-22 * * *'
permissions:
  contents: write
concurrency:
  group: memara-betsharp-nba-points
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check local scheduled window and existing snapshot
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          local=datetime.now(ZoneInfo('Europe/Sarajevo'))
          et=datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          run=os.environ['EVENT_NAME'] in ('workflow_dispatch', 'push') or (local.hour==11 and local.minute>=45) or 12 <= local.hour <= 23
          p=Path('collector-output/betsharp-nba-daily.json')
          try:
              d=json.loads(p.read_text())
          except (OSError, ValueError):
              d={}
          if (d.get('game_date_et')==et and d.get('status')=='ok'
              and isinstance(d.get('offers'),list) and d['offers']
              and d.get('player_count')==len(d['offers'])):
              run=False
              print('BETSHARP_ALREADY_COLLECTED',et)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('run='+str(run).lower()+'\n')
          print('BETSHARP_GATE',local.isoformat(),run)
          PY
      - name: Clear old BetSharp snapshot and verify feedback on main
        id: clearance
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          path=collector-output/betsharp-nba-daily.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --ff-only origin/main
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p=Path('collector-output/betsharp-nba-daily.json')
          day=datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          try:
              d=json.loads(p.read_text())
          except (OSError,ValueError):
              d={}
          if (d.get('game_date_et')==day and d.get('status')=='ok'
              and isinstance(d.get('offers'),list) and d['offers']
              and d.get('player_count')==len(d['offers'])):
              raise SystemExit('Current daily snapshot appeared; refusing to erase it')
          if not (d.get('clearance_date_et')==day and d.get('status')=='awaiting_daily_refresh'
                  and d.get('player_count')==0 and d.get('offers')==[] and d.get('cleared_at_utc')):
              d={'schema_version':'1.0','source':'BetSharp','source_url':'https://betsharp.com/nba/props?m=points',
                 'market':'player_points','game_date_et':None,'collected_at_utc':None,
                 'player_count':0,'offers':[],'status':'awaiting_daily_refresh',
                 'clearance_date_et':day,'cleared_at_utc':datetime.now(timezone.utc).isoformat(),
                 'note':'Active offer cleared; historical captures and tickets unchanged.'}
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git add -- "$path"
          if ! git diff --cached --quiet; then
            git commit -m "data: clear BetSharp NBA active list before collection"
            # Non-fast-forward failure leaves main safe; next scheduled attempt retries.
            git push origin HEAD:main
          fi
          git fetch origin main
          git show "origin/main:$path" > "$RUNNER_TEMP/betsharp-clearance.json"
          python - <<'PY'
          import json,os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'betsharp-clearance.json').read_text())
          day=datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          assert d.get('clearance_date_et')==day and d.get('status')=='awaiting_daily_refresh'
          assert d.get('player_count')==0 and d.get('offers')==[] and d.get('cleared_at_utc')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('confirmed=true\n')
          print('NBA_CLEARANCE_CONFIRMED=true',day,d['cleared_at_utc'])
          PY
      - name: Install HTML parser
        if: steps.clearance.outputs.confirmed == 'true'
        run: pip install 'beautifulsoup4>=4.12,<5'
      - name: Collect all listed NBA points players for today's ET games
        if: steps.clearance.outputs.confirmed == 'true'
        run: python collect_betsharp_nba.py
      - name: Split complete captured offer into ten daily lists
        if: steps.clearance.outputs.confirmed == 'true'
        run: python split_betsharp_nba_into_ten.py
      - name: Verify all ten lists and emit readiness feedback in same collection job
        if: steps.clearance.outputs.confirmed == 'true'
        run: python nba_system_first_group_feedback.py
      - name: Archive today's immutable capture and commit
        if: steps.clearance.outputs.confirmed == 'true'
        run: |
          set -euo pipefail
          date_et="$(python -c "import json;print(json.load(open('collector-output/betsharp-nba-daily.json'))['game_date_et'])")"
          mkdir -p collector-output/betsharp-history
          cp collector-output/betsharp-nba-daily.json "collector-output/betsharp-history/${date_et}.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- collector-output/betsharp-nba-daily.json "collector-output/betsharp-history/${date_et}.json"
          git add -- "collector-output/nba-system-lists/${date_et}/"
          git add -- collector-output/nba-system-feedback.json
          if ! git diff --cached --quiet; then
            git commit -m "data: BetSharp NBA points snapshot ${date_et}"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
