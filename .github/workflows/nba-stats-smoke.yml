name: NBA stats ESPN all candidates
on:
  push:
    branches: [test/nba-stats-preseason-20261027]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest -v test_nba_stats_collector.py
      - name: Refresh daily NBA offers (live API fallback)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python nba_refresh_offers.py
      - name: ESPN all-candidates live fetch
        run: python nba_stats_collector.py --output collector-output/nba-player-stats.json
      - name: Screen player points candidates
        run: python nba_screening.py
      - name: Upload complete stats report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-stats-all-candidates
          path: |
            collector-output/nba-player-points.json
            collector-output/nba-player-stats.json
            collector-output/nba-screening.json
          if-no-files-found: warn
      - name: Print results
        if: always()
        run: |
          if [ -f collector-output/nba-player-stats.json ]; then python -c "import json;d=json.load(open('collector-output/nba-player-stats.json'));print(json.dumps({'players':[{'name':p['player'],'regular':p['regular_count'],'preseason':p['preseason_count'],'games':p['recent_games']} for p in d['players']],'errors':d['errors']},indent=2))"; fi
