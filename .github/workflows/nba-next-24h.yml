name: MEMARA NBA next 24 hours
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: memara-nba-24h
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Sarajevo scheduling hour
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json
          from pathlib import Path
          local = datetime.now(ZoneInfo('Europe/Sarajevo'))
          ok = os.environ['EVENT_NAME'] == 'workflow_dispatch' or local.hour == 12
          if ok and os.environ['EVENT_NAME'] == 'schedule':
              try:
                  last = json.loads(Path('collector-output/nba-next-24h.json').read_text())
                  stamp = datetime.fromisoformat(last['collected_at_utc'].replace('Z','+00:00'))
                  if stamp.astimezone(ZoneInfo('Europe/Sarajevo')).date() == local.date() and last.get('status') == 'ok':
                      ok = False
                      print('NBA_PRECOLLECT_SKIP already collected successfully today')
              except (OSError,KeyError,ValueError,TypeError):
                  pass
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print('run=' + str(ok).lower(), file=f)
          print('Sarajevo local hour:', local.hour, 'Run:', ok)
          PY
      - name: Verify Python syntax
        if: steps.clock.outputs.run == 'true'
        run: python -m py_compile collector_nba_24h.py nba_analysis_merge.py
      - name: Clear and COMMIT old NBA offers, retry branch conflicts
        if: steps.clock.outputs.run == 'true'
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_nba_clear_before_collect.py -v
          python nba_clear_before_collect.py
          stamp="$(python nba_clear_before_collect.py --verify | awk '{print $2}')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- collector-output/nba-next-24h.json collector-output/nba-player-points.json collector-output/nba-analysis-ready.json collector-output/ticket-c-research.json collector-output/nba-free-statistics.json
          git commit -m "data: clear NBA before collecting [skip ci]"
          published=false
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              published=true
              break
            fi
            echo "NBA cleanup push conflict, attempt $attempt"
            sleep 5
          done
          if [ "$published" != true ]; then
            echo "::error::NBA cleanup could not be committed, collector blocked"
            exit 1
          fi
          git fetch origin main
          python nba_clear_before_collect.py --verify --ref origin/main --stamp "$stamp"
          echo "NBA_CLEARANCE_CONFIRMED=true"
      - name: Verify clearance before ESPN fetch
        if: steps.clock.outputs.run == 'true'
        run: |
          git fetch origin main
          python nba_clear_before_collect.py --verify --ref origin/main
      - name: Fetch NBA games and team rosters
        if: steps.clock.outputs.run == 'true'
        run: python collector_nba_24h.py --hours 24 --output collector-output/nba-next-24h.json
      - name: Validate output and print summary
        if: steps.clock.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          with open('collector-output/nba-next-24h.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data['publication_allowed'] is False
          assert data['window_start_utc'] < data['window_end_utc']
          assert all(p['points_line'] is None and p['over_odds'] is None and p['under_odds'] is None for p in data['players'])
          print('NBA:', data['game_count'], 'games,', data['player_candidate_count'], 'roster candidates')
          PY
      - name: Initialize separate analyst queue (odds pending)
        if: steps.clock.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('collector-output/nba-player-points.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({'generated_at_utc': None, 'offers': [], 'offer_count': 0}) + '\n')
          PY
          python nba_analysis_merge.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.clock.outputs.run == 'true'
        with:
          name: nba-next-24h
          path: |
            collector-output/nba-next-24h.json
            collector-output/nba-analysis-ready.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit JSON snapshot without altering tickets
        if: steps.clock.outputs.run == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector-output/nba-next-24h.json collector-output/nba-analysis-ready.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh NBA next-24h candidate snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
