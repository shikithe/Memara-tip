name: SAFE Nov25 B-only publisher verification
on:
  push:
    branches: [test/publish-b-top10-3plus-20261125]
    paths:
      - memarasix-football-ai-approved.json
      - .github/workflows/test-approve-b-20261125.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regress publisher safety and virtual bank
        run: |
          python -m unittest -v test_memarasix_espn_ab_publish.py
          python - <<'PY'
          import json,tempfile,copy
          from pathlib import Path
          from datetime import datetime,timedelta
          from memarasix_espn_ab_publish import read,write,publish
          a=read("memarasix-football-ai-approved.json")
          d=read("data.json")
          assert a["date"]==d["date"]=="2026-11-25"
          assert len(a["tickets"])==1 and a["tickets"][0]["id"]=="B"
          assert len(d["tickets"])==1 and d["tickets"][0]["id"]=="A"
          b=a["tickets"][0]
          assert len(b["matches"])==2 and all(x["pick"]=="3+" for x in b["matches"])
          assert abs(b["matches"][0]["odd"]*b["matches"][1]["odd"]-b["combined_odds"])<1e-8
          assert 2<=b["combined_odds"]<=3
          assert all(x["final_ev_pct"]<0 for x in b["matches"])
          assert not set(x["fixture_id"] for x in b["matches"]) & set(x["fixture_id"] for x in d["tickets"][0]["matches"])
          now=datetime.fromisoformat(a["approved_at_utc"].replace("Z","+00:00"))+timedelta(minutes=1)
          assert all(datetime.fromisoformat(x["datetime"].replace("Z","+00:00"))>now+timedelta(minutes=20) for x in b["matches"])
          with tempfile.TemporaryDirectory() as td:
            p=Path(td)
            write(p/"data.json",d)
            write(p/"memarasix-football-ai-approved.json",a)
            output=publish(p,now=now)
            after=read(p/"data.json")
            assert output["status"]=="published" and output["tickets"]==["B"]
            assert after["tickets"][0]==d["tickets"][0]
            assert [t["id"] for t in after["tickets"]]==["A","B"]
            assert after["tickets"][1]["stake"]==7.50
            assert after["bank_after"]==290.70
            assert after["reserved_nba_c_budget"]==4.77
            assert after["daily_stake"]==27.00
            assert publish(p,now=now)["status"]=="no_update"
          assert read("data.json")==d
          print("B_ONLY_PUBLISH_SAFE_A_PRESERVED_BANK_C_RESERVED")
          PY
