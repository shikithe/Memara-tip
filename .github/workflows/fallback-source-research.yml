name: MemaraSix fallback statistics source research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fallback-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recreate first-stage filtering
        run: python fixture_prefilter.py
      - name: Re-evaluate supported leagues
        run: python statistics_filter.py
      - name: Refresh authoritative fixture country metadata
        run: |
          DAY=$(python -c "import json;print(json.load(open('collector-output/statistics-research.json'))['date'])")
          python sync_sports_stats.py --date "$DAY" --fixtures-only --output collector-output/fallback-fixtures-country.json
      - name: Probe fallback provider coverage
        run: python fallback_source_probe.py
      - name: Upload read-only coverage audit
        uses: actions/upload-artifact@v4
        with:
          name: memarasix-fallback-source-audit
          path: |
            collector-output/statistics-filter.json
            collector-output/fallback-source-audit.json
            collector-output/fallback-fixtures-country.json
          if-no-files-found: error
