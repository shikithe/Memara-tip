name: NBA 10 — ready feedback 18:10 Sarajevo
on:
  schedule:
    # 18:10 Europe/Sarajevo: UTC 16:20 (summer), 17:20 (winter).
    - cron: '10 16,17 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-system-ledger
  cancel-in-progress: false
jobs:
  ready-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify local schedule (or manual dispatch)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo("Europe/Sarajevo"))
          run=os.environ["EVENT_NAME"]=="workflow_dispatch" or (now.hour==18 and now.minute>=10 and now.minute<55)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("run="+str(run).lower()+"\n")
          print("READY_FEEDBACK_GATE",now.isoformat(),run)
          PY
      - name: Emit first-group feedback only if all ten match today's BetSharp source
        if: steps.gate.outputs.run == 'true'
        run: python nba_system_first_group_feedback.py
      - name: Commit readiness signal without overwriting newer publication feedback
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- collector-output/nba-system-feedback.json
          if ! git diff --cached --quiet; then
            git commit -m "data: NBA 10 initial Scout readiness feedback [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
