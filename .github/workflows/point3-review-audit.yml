name: MemaraSix point 3 review audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/point3-review-audit.yml'
permissions:
  contents: read
jobs:
  review-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recreate prefilter at current time
        run: python fixture_prefilter.py
      - name: Re-evaluate statistical coverage
        run: python statistics_filter.py
      - name: Compare coverage with previous nine
        run: |
          python - <<'PY'
          import json
          p=json.load(open('collector-output/statistics-filter.json'))
          count=p['counts']['covered']
          print('POINT3 COMPARISON:',json.dumps({'previous_covered':9,'current_covered':count,'difference':count-9,'counts':p['counts'],'competitions_loaded':p.get('competitions_loaded',[])}))
          PY
      - name: Diagnose all review fixtures
        run: python point3_review_audit.py
      - name: Independently audit every condition
        run: python point3_condition_matrix.py
      - uses: actions/upload-artifact@v4
        with:
          name: memarasix-point3-review-audit
          path: |
            collector-output/statistics-filter.json
            collector-output/point3-review-audit.json
            collector-output/point3-condition-matrix.json
          if-no-files-found: error
