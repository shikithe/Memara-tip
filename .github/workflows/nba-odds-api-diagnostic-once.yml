name: NBA bookmaker API diagnostic once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nba-odds-api-diagnostic-once.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - name: Inspect provider event and one player-points response (no ticket writes)
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          from datetime import datetime, timezone
          key=os.environ.get("THE_ODDS_API_KEY","")
          print("API_KEY_PRESENT",bool(key))
          if not key:
              raise SystemExit("API credential missing")
          base="https://api.the-odds-api.com/v4/sports/basketball_nba"
          def call(url):
              req=Request(url,headers={"x-api-key":key,"Accept":"application/json","User-Agent":"MemaraSix-ReadOnly-Diag"})
              try:
                  with urlopen(req,timeout=20) as r:
                      body=r.read()
                      print("API_STATUS",r.status,"credits_remaining",r.headers.get("x-requests-remaining"),"credits_used",r.headers.get("x-requests-used"))
                  return json.loads(body)
              except HTTPError as e:
                  body=e.read(1024).decode("utf-8","replace")
                  body=body.replace(key,"[REDACTED]")
                  print("API_HTTP_ERROR",e.code,"credits_remaining",e.headers.get("x-requests-remaining"),"credits_used",e.headers.get("x-requests-used"),"message",body[:350])
                  return None
          events=call(base+"/events?"+urlencode({"apiKey":key}))
          if not isinstance(events,list):
              raise SystemExit("Event endpoint inaccessible")
          print("API_EVENTS",len(events))
          now=datetime.now(timezone.utc)
          future=[]
          for e in events:
              try:
                  start=datetime.fromisoformat(e["commence_time"].replace("Z","+00:00"))
                  if start>now:future.append((start,e))
              except (KeyError,ValueError,TypeError):pass
          if not future:
              raise SystemExit("No upcoming NBA events listed by odds provider")
          future.sort(key=lambda x:x[0])
          start,e=future[0]
          print("DIAGNOSTIC_EVENT",e.get("home_team"),"vs",e.get("away_team"),"starts",start.isoformat())
          data=call(base+"/events/"+e["id"]+"/odds?"+urlencode({"apiKey":key,"regions":"us","markets":"player_points","oddsFormat":"decimal"}))
          if isinstance(data,dict):
              markets=sum(sum(m.get("key")=="player_points" for m in book.get("markets",[])) for book in data.get("bookmakers",[]))
              print("API_PLAYER_POINTS_AVAILABLE_BOOKMAKERS",markets)
          PY
