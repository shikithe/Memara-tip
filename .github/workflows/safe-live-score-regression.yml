name: SAFE MemaraSix A/B/C live tracking end-to-end regression
on:
  push:
    branches: [fix/verified-nba-c-live-identity-20261124]
    paths:
      - 'index.html'
      - 'nba_live_points.py'
      - 'tests/test_nba_live_points.py'
      - 'tests/test_browser_nba_c_fallback.cjs'
      - '.github/workflows/safe-live-score-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run actual settlement and score state regressions
        run: |
          python -m unittest discover -s tests -p test_virtual_settlement.py -v
          python -m unittest discover -s tests -p test_football_live_scores.py -v
          python -m unittest discover -s tests -p test_live_tracking_contract.py -v
          python -m unittest discover -s tests -p test_nba_live_points.py -v
          python -m unittest discover -s tests -p test_archive_handoff.py -v
      - name: Validate browser JS syntax and run C placeholder regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('index.html').read_text()
          start=code.index('<script>')+len('<script>')
          end=code.index('</script>',start)
          Path('/tmp/memara-current.js').write_text(code[start:end],encoding='utf8')
          PY
          node --check /tmp/memara-current.js
          node tests/test_browser_nba_c_fallback.cjs
      - name: Fetch real ESPN scoreboards and NBA summaries without commits
        run: |
          python sync_live_scores.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data.json").read_text())
          s=json.loads(Path("live-scores.json").read_text())
          print("SNAPSHOT_UTC",s["updated_at_utc"])
          print("ERRORS",s["errors_count"])
          for row in s["matches"]:
              print("LIVE_CHECK",json.dumps({key:row.get(key) for key in
                 ("ticket","index","state","event_id","player_id","sport",
                  "score","player_points","minute","period","game_clock","result_status")},
                 ensure_ascii=False))
          assert d["date"]==s["date"]=="2026-11-24"
          assert {t["id"] for t in d["tickets"]}=={"A","B","C"}
          assert len(s["matches"])==6
          assert len([x for x in s["matches"] if x["ticket"] in ("A","B")
             and x["state"]!="unverified"])==4
          assert len([x for x in s["matches"] if x["ticket"]=="C"
             and x["state"] in ("scheduled","live","final")
             and x.get("sport")=="basketball" and x.get("event_id") and x.get("player_id")])==2
          assert s["errors_count"]==0
          print("ABC_REAL_ESPNSCORE_AND_C_SCHEDULE_VERIFIED")
          PY
      - name: Confirm no financial mutation or production write
        run: |
          test "$GITHUB_REF_NAME" = "fix/verified-nba-c-live-identity-20261124"
          git diff --quiet -- data.json || exit 1
          echo "NO_PRODUCTION_WRITE_NO_BANK_CHANGE"
