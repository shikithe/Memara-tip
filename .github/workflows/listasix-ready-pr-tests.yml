name: ListaSix-ready PR signaling regression
on:
  pull_request:
    paths:
      - 'memarasix_ready_pr.py'
      - 'tests/test_listasix_ready_pr.py'
      - '.github/workflows/listasix-sync.yml'
      - '.github/workflows/listasix-ready-pr-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate PR handoff and independent publisher boundaries
        run: |
          python3 -m unittest discover -s tests -p 'test_listasix_ready_pr.py' -v
          python3 -m unittest discover -s tests -p 'test_single_ai_approval_writer.py' -v
          python3 -m unittest -v test_memarasix_verified_quotes.py
