name: MEMARA NBA player-points odds sync
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: memara-nba-props
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check schedule and credentials
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          active = True
          if not os.environ.get("THE_ODDS_API_KEY"):
              print("No API key configured; skipping without updating existing data")
              active = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print("run="+str(active).lower(), file=f)
          PY
      - name: Verify syntax
        if: steps.gate.outputs.run == 'true'
        run: python -m py_compile sync_nba_points.py
      - name: Refresh NBA fixtures and player candidates
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile collector_nba_24h.py
          python collector_nba_24h.py --hours 24 --output collector-output/nba-next-24h.json
      - name: Verify fresh NBA fixture snapshot
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          with open('collector-output/nba-next-24h.json', encoding='utf-8') as f:
              data = json.load(f)
          stamp = datetime.fromisoformat(data['collected_at_utc'].replace('Z', '+00:00'))
          age = (datetime.now(timezone.utc) - stamp).total_seconds()
          assert data.get('status') == 'ok', 'NBA fixture collection failed'
          assert 0 <= age <= 900, f'NBA fixture snapshot is stale ({age:.0f}s)'
          print('Fresh NBA fixtures:', data.get('game_count'), 'games;', data.get('player_candidate_count'), 'players')
          PY
      - name: Get player props
        if: steps.gate.outputs.run == 'true'
        run: python sync_nba_points.py --region us
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true' && always()
        with:
          name: nba-player-points
          path: collector-output/nba-player-points.json
          if-no-files-found: warn
          retention-days: 7
      - name: Attach fresh verified-source points lines to analyst queue
        if: steps.gate.outputs.run == 'true' && success()
        run: |
          python -m py_compile memara_enrich_nba_props.py
          if [ -f collector-feed.json ]; then
            python memara_enrich_nba_props.py --feed collector-feed.json --props collector-output/nba-player-points.json --output collector-feed.json
            python memara_math.py --input collector-feed.json --output collector-feed.json
          else
            echo "Collector feed missing; leave ticket files unchanged"
          fi
      - name: Save unanalysed odds snapshot
        if: steps.gate.outputs.run == 'true' && success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector-output/nba-next-24h.json collector-output/nba-player-points.json collector-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh NBA player-points odds snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
