name: MemaraSix clear obsolete daily approval inputs
on:
  workflow_dispatch:
  schedule:
    # Midnight Sarajevo CET/CEST, plus fallback 08:00 local.
    - cron: '0,15,30,45 22,23,6,7 * * *'
permissions:
  contents: write
concurrency:
  group: memarasix-daily-publication
  cancel-in-progress: false
jobs:
  clear-stale-approvals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check local midnight or morning backup
        id: gate
        run: |
          python3 - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          from pathlib import Path
          import os
          clock=datetime.now(ZoneInfo("Europe/Sarajevo")).time().replace(tzinfo=None)
          ok=time(0)<=clock<time(1) or time(8)<=clock<time(9)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("ready="+str(ok).lower()+"\n")
          print("APPROVAL_MIDNIGHT_GATE",ok)
          PY
      - name: Test safe approval cleanup
        run: python3 -m unittest discover -s tests -p test_midnight_approvals.py -v
      - name: Remove obsolete approval inputs only
        if: steps.gate.outputs.ready == 'true'
        run: python3 reset_daily_approvals.py
      - name: Commit only approval files (never data.json or archive.json)
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- memarasix-football-ai-approved.json memarasix-1455-approved.json
          if ! git diff --cached --quiet; then
            git commit -m 'Clear yesterday AI approval inputs [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
