name: Test early goals credit (isolated)
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/early-goals-credit-20261026
    paths:
      - '.github/workflows/test-early-goals-credit.yml'
      - 'settle_virtual_tickets.py'
      - 'sync_live_scores.py'
      - 'tests/test_virtual_settlement.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m py_compile settle_virtual_tickets.py sync_live_scores.py
      - name: Verify settlement and idempotence
        run: python -m unittest discover -s tests -p test_virtual_settlement.py -v
