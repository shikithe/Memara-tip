name: MEMARASIX isolated Collector to Agent pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC daily; 09:00 Sarajevo winter, 10:00 summer
permissions:
  contents: write
concurrency:
  group: memarasix-isolated-collector-agent
  cancel-in-progress: false
jobs:
  collector-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collector-isolated-test-20261030
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Kvoter regression tests
        run: |
          python -m compileall -q kvoter
          python -m unittest discover -s kvoter -p 'test_*.py' -v
      - name: Create isolated shared workspace
        run: mkdir -p /tmp/memara-shared/agent /tmp/kvoter-private
      - name: Run ESPN collector
        run: python collector/collector_24h.py --output /tmp/memara-shared/collector-raw.json
      - name: Prepare collector feed in shared workspace
        run: python collector/memara_prepare_feed.py --input /tmp/memara-shared/collector-raw.json --output /tmp/memara-shared/collector-feed.json
      - name: Validate feed and trigger agent
        run: |
          python agent/shared_volume_trigger.py --once \
            --feed /tmp/memara-shared/collector-feed.json \
            --output /tmp/memara-shared/agent/history-h2h.json \
            --state /tmp/memara-shared/agent/.last-processed-sha256
          test -s /tmp/memara-shared/agent/history-h2h.json || { echo "Agent output missing"; exit 1; }
      - name: Fetch odds for Agent fixtures into shared volume
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python kvoter/the_odds_api.py \
            --feed /tmp/memara-shared/agent/history-h2h.json \
            --output /tmp/memara-shared/kvoter/odds.json \
            --raw-output /tmp/memara-shared/kvoter/league-odds-raw.json \
            --offers-output /tmp/memara-shared/kvoter/provider-offers.json
          test -s /tmp/memara-shared/kvoter/odds.json
      - name: Export primary-only matches and actual odds to PDF
        run: |
          python -m pip install reportlab==4.2.5
          python kvoter/primary_matches_pdf.py \
            --history /tmp/memara-shared/agent/history-h2h.json \
            --offers /tmp/memara-shared/kvoter/provider-offers.json \
            --output /tmp/memara-shared/kvoter/primary-matches-odds.pdf \
            --json-output /tmp/memara-shared/kvoter/primary-matches-odds.json
          test -s /tmp/memara-shared/kvoter/primary-matches-odds.pdf
      - name: Kvoter database, manual matching, and research queue
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python kvoter/workflow.py \
            --history /tmp/memara-shared/agent/history-h2h.json \
            --offers /tmp/memara-shared/kvoter/provider-offers.json \
            --database kvoter/team-database.json \
            --manual "kvoter/unesi rucno/aliases.json" \
            --matched-output /tmp/memara-shared/kvoter/matched-fixtures.json \
            --unmatched-output "kvoter/unesi rucno/unmatched-fixtures.json" \
            --research-output /tmp/kvoter-private/research-review.json \
            --report /tmp/memara-shared/kvoter/match-report.json
      - name: Build evidence-based Kvoter Manual candidate queue
        run: |
          python kvoter/manual_candidates.py \
            --history /tmp/memara-shared/agent/history-h2h.json \
            --offers /tmp/memara-shared/kvoter/provider-offers.json \
            --unmatched "kvoter/unesi rucno/unmatched-fixtures.json" \
            --output /tmp/memara-shared/kvoter/manual-candidates.json
      - name: Generate daily public text list from this collector and odds run
        run: |
          python kvoter/daily_text.py \
            --history /tmp/memara-shared/agent/history-h2h.json \
            --matched /tmp/memara-shared/kvoter/matched-fixtures.json \
            --output /tmp/memara-shared/kvoter/dnevna-lista.txt
          test -s /tmp/memara-shared/kvoter/dnevna-lista.txt
      - name: Verify end-to-end result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/memara-shared')
          feed=json.loads((root/'collector-feed.json').read_text())
          result=json.loads((root/'agent/history-h2h.json').read_text())
          assert len(feed['football_candidates'])>0, 'Empty collector feed'
          assert len(result['fixtures'])==len(feed['football_candidates']), 'Agent fixture count mismatch'
          odds=json.loads((root/'kvoter/odds.json').read_text())
          assert odds['matched']+odds['unavailable']==len(result['fixtures']), 'Kvoter fixture count mismatch'
          matched=json.loads((root/'kvoter/matched-fixtures.json').read_text())['fixtures']
          unmatched=json.loads(Path('kvoter/unesi rucno/unmatched-fixtures.json').read_text())['fixtures']
          assert len(matched)+len(unmatched)==len(result['fixtures']), 'Final partition count mismatch'
          assert not ({x['fixture_id'] for x in matched} & {x['fixture_id'] for x in unmatched}), 'Fixture present in both lists'
          assert odds['publication_allowed'] is False
          assert odds['bank_modified'] is False
          print('KVOTER',odds['provider_status'],'matched',odds['matched'])
          assert result['publication_allowed'] is False
          assert result['bank_modified'] is False
          print('PIPELINE_OK', 'fixtures',len(result['fixtures']),'ESPN_errors',len(result['errors']))
          PY
      - name: Persist approved Kvoter aliases to isolated GitHub branch
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- kvoter/team-database.json
          if git diff --cached --quiet; then
            echo "KVOTER_DB_UNCHANGED"
          else
            git commit -m "kvoter: persist verified team aliases [skip ci]"
            git push origin HEAD:collector-isolated-test-20261030
            echo "KVOTER_DB_PERSISTED"
          fi
      - name: Persist active collector feed (23h59m TTL) on isolated branch
        if: success()
        run: |
          set -euo pipefail
          python collector/active_feed_store.py validate --feed /tmp/memara-shared/collector-feed.json --raw /tmp/memara-shared/collector-raw.json
          mkdir -p collector/active
          cp /tmp/memara-shared/collector-feed.json collector/active/collector-feed.json
          cp /tmp/memara-shared/collector-raw.json collector/active/collector-raw.json
          python collector/active_feed_store.py validate --feed collector/active/collector-feed.json --raw collector/active/collector-raw.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- collector/active/collector-feed.json collector/active/collector-raw.json
          if git diff --cached --quiet; then
            echo "ACTIVE_FEED_UNCHANGED"
          else
            git commit -m "collector: replace isolated active feed [skip ci]"
            git push origin HEAD:collector-isolated-test-20261030
            echo "ACTIVE_FEED_PERSISTED"
          fi
      - name: Persist daily ESPN history H2H database on isolated branch
        if: success()
        run: |
          set -euo pipefail
          mkdir -p agent/active
          cp /tmp/memara-shared/agent/history-h2h.json agent/active/history-h2h.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('agent/active/history-h2h.json').read_text())
          assert data['fixtures'] and data['publication_allowed'] is False and data['bank_modified'] is False
          print('AGENT_HISTORY_PERSISTED',len(data['fixtures']),'errors',len(data['errors']))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- agent/active/history-h2h.json
          if git diff --cached --quiet; then
            echo "AGENT_HISTORY_UNCHANGED"
          else
            git commit -m "agent: store daily ESPN history and H2H [skip ci]"
            git push origin HEAD:collector-isolated-test-20261030
          fi
      - name: Publish unmatched fixtures to Kvoter Manual Pages
        if: success()
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/kvoter-manual-pages origin/main
          mkdir -p /tmp/kvoter-manual-pages/kvoter/manual
          cp "kvoter/unesi rucno/unmatched-fixtures.json" /tmp/kvoter-manual-pages/kvoter/manual/unmatched-fixtures.json
          cp /tmp/memara-shared/kvoter/manual-candidates.json /tmp/kvoter-manual-pages/kvoter/manual/manual-candidates.json
          cp /tmp/memara-shared/kvoter/dnevna-lista.txt /tmp/kvoter-manual-pages/kvoter/dnevna-lista.txt
          cd /tmp/kvoter-manual-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- kvoter/manual/unmatched-fixtures.json kvoter/manual/manual-candidates.json kvoter/dnevna-lista.txt
          if git diff --cached --quiet; then
            echo "KVOTER_MANUAL_QUEUE_UNCHANGED"
          else
            git commit -m "kvoter manual: publish latest unmatched queue [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "KVOTER_MANUAL_QUEUE_PUBLISHED"
          fi
      - name: Upload isolated pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memarasix-isolated-collector-agent
          path: |
            /tmp/memara-shared/collector-raw.json
            /tmp/memara-shared/collector-feed.json
            /tmp/memara-shared/agent/history-h2h.json
            /tmp/memara-shared/kvoter/odds.json
            /tmp/memara-shared/kvoter/primary-matches-odds.pdf
            /tmp/memara-shared/kvoter/primary-matches-odds.json
            /tmp/memara-shared/kvoter/league-odds-raw.json
            /tmp/memara-shared/kvoter/provider-offers.json
            /tmp/memara-shared/kvoter/match-report.json
            /tmp/memara-shared/kvoter/matched-fixtures.json
            /tmp/memara-shared/kvoter/manual-candidates.json
            kvoter/unesi rucno/unmatched-fixtures.json
            /tmp/kvoter-private/research-review.json
            kvoter/team-database.json
          if-no-files-found: ignore
