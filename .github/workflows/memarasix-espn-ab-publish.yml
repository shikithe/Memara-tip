name: MemaraSix A/B — ESPN-only AI-approved publication
on:
  push:
    branches: [main]
    paths:
      - 'memarasix-football-ai-approved.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: memarasix-daily-publication
  cancel-in-progress: false
jobs:
  publish-football:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify ESPN-only publication contract
        run: python3 -m unittest -v test_memarasix_espn_ab_publish.py
      - name: Publish only independently AI-approved A/B (no Kvoter)
        run: python3 memarasix_espn_ab_publish.py
      - name: Commit publisher-owned result only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data.json memarasix-1455-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "MemaraSix: ESPN-only A/B approval result [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
