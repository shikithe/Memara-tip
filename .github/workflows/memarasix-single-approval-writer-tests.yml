name: MemaraSix single AI approval writer tests
on:
  pull_request:
    paths:
      - '.github/workflows/listasix-sync.yml'
      - '.github/workflows/memarasix-scheduled-publication.yml'
      - 'memarasix_auto_approval.py'
      - 'tests/test_single_ai_approval_writer.py'
      - '.github/workflows/memarasix-single-approval-writer-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce AI-only approval and unchanged publisher verification
        run: |
          python3 -m unittest discover -s tests -p 'test_single_ai_approval_writer.py' -v
          python3 -m unittest discover -s tests -p 'test_auto_ab_approval.py' -v
          python3 -m unittest -v test_memarasix_publication_gate.py test_memarasix_verified_quotes.py
