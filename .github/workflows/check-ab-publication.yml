name: Senzor A/B
on:
  push:
    branches: [main]
    paths:
      - 'inspektor_ab.py'
      - 'test_inspektor_ab.py'
      - 'ab_sensor_phase.py'
      - 'test_ab_sensor_phase.py'
      - '.github/workflows/check-ab-publication.yml'
  workflow_dispatch:
  schedule:
    # Covers CET and CEST: technical checks stop at confirmed TOP10; publication 13:00-23:45 local.
    - cron: '0,15,30,45 8-22 * * *'
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: memarasix-ab-publication-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Determine Sarajevo technical / publication phase
        id: gate
        run: |
          python3 -m unittest -v test_ab_sensor_phase.py
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from ab_sensor_phase import phase
          from pathlib import Path
          now=datetime.now(ZoneInfo("Europe/Sarajevo"))
          marker=Path("collector-output/ab-preparation-feedback.json")
          try:
              preparation=json.loads(marker.read_text(encoding="utf-8")) if marker.exists() else None
          except (ValueError,OSError):
              preparation=None
          current=phase(now,preparation)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("phase="+current+"\n")
          print("SENZOR_AB_PHASE",current,now.isoformat())
          PY
      - name: Verify publication checker behavior
        if: steps.gate.outputs.phase == 'technical'
        run: python3 -m unittest -v test_check_ab_publication.py
      - name: Verify published A/B from actual website data
        if: steps.gate.outputs.phase == 'technical'
        run: python3 check_ab_publication.py
      - name: Inspektor — resume from first missing stage only
        if: steps.gate.outputs.phase == 'technical'
        id: inspector
        run: |
          python3 -m unittest -v test_inspektor_ab.py
          python3 inspektor_ab.py
      - name: Inspektor confirms TOP10 — tell Sensor to suspend technical preparation
        if: steps.gate.outputs.phase == 'technical' && steps.inspector.outputs.next_stage == 'await_publication'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("collector-output/ab-inspector.json").read_text(encoding="utf-8"))
          if x.get("feedback")!="TOP10_CONFIRMED_WAIT_PUBLICATION" or x.get("next_stage")!="await_publication":
              raise SystemExit("No verified TOP10 confirmation")
          marker={"date":x["date"],"feedback":x["feedback"],"source_fingerprint":x["source_fingerprint"],
                  "top10_count":x["top10_count"],"next_action":"publication_only_from_13_00"}
          path=Path("collector-output/ab-preparation-feedback.json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(marker,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")
          print("SENSOR_STANDBY_UNTIL_1300",x["date"],marker["top10_count"])
          PY

      - name: Inspektor — trigger only the missing technical stage
        continue-on-error: true
        if: steps.gate.outputs.phase == 'technical' && (steps.inspector.outputs.next_stage == 'espn' || steps.inspector.outputs.next_stage == 'tipsterarea' || steps.inspector.outputs.next_stage == 'history' || steps.inspector.outputs.next_stage == 'scout_6of6')
        env:
          INSPECTOR_DISPATCH_TOKEN: ${{ secrets.INSPECTOR_DISPATCH_TOKEN }}
          NEXT_STAGE: ${{ steps.inspector.outputs.next_stage }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          stage=os.environ["NEXT_STAGE"]
          workflows={"espn":"listasix-daily.yml","tipsterarea":"tipster-html-collector.yml",
                     "history":"listasix-scout-history.yml",
                     "scout_6of6":"listasix-scout-six-markets.yml"}
          now=datetime.now(ZoneInfo("Europe/Sarajevo"))
          if not time(10,0) <= now.time().replace(tzinfo=None) <= time(12,15):
              print("INSPECTOR_WINDOW_CLOSED")
              raise SystemExit(0)
          token=os.environ.get("INSPECTOR_DISPATCH_TOKEN")
          if not token:
              print("::warning::INSPECTOR_DISPATCH_TOKEN missing: cross-repository workflow cannot be triggered")
              raise SystemExit(1)
          path=workflows[stage]
          url=f"https://api.github.com/repos/shikithe/Slavojka/actions/workflows/{path}/dispatches"
          req=urllib.request.Request(url,data=b'{"ref":"main"}',method="POST",headers={
              "Authorization":"Bearer "+token,"Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=20) as response:
              if response.status!=204:
                  raise RuntimeError("Failed to trigger: HTTP "+str(response.status))
          print("INSPECTOR_RESUMED",stage,path)
          PY

      - name: Inspektor — issue AI analyst handoff only when Scout is ready
        if: steps.gate.outputs.phase == 'technical' && steps.inspector.outputs.next_stage == 'ai_analysis'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          report=json.loads(Path("collector-output/ab-inspector.json").read_text())
          title="INSPEKTOR A/B — AI Scout review — "+report["date"]
          query=subprocess.run(["gh","issue","list","--state","open","--repo",os.environ["GH_REPO"],
              "--search",title,"--json","title,number"],text=True,capture_output=True,check=True)
          if any(x["title"]==title for x in json.loads(query.stdout)):
              print("AI_INSPECTOR_HANDOFF_ALREADY_OPEN")
          else:
              body=("Today's ESPN, TipsterArea and Scout 6/6 are ready; A/B still not both published.\n"
                    "Independent AI analyst: review Scout 6/6 shortlist, injuries, xG if available, "
                    "lineups, form, H2H and verified prices. Commit only genuinely approved A/B to "
                    "memarasix-football-ai-approved.json for existing publisher. Never auto-approve "
                    "tickets or fabricate selections.\n"
                    "Read collector-output/ab-inspector.json for exact status.")
              subprocess.run(["gh","issue","create","--repo",os.environ["GH_REPO"],
                  "--title",title,"--body",body],check=True)
              print("AI_INSPECTOR_HANDOFF_OPENED")
          PY

      - name: Publication-only sensor every 15min from 13:00; stop on A+B
        if: steps.gate.outputs.phase == 'publication'
        id: publication
        run: |
          python3 -m unittest -v test_check_ab_publication.py
          python3 check_ab_publication.py
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from ab_sensor_phase import publication_feedback
          from check_ab_publication import check
          today=datetime.now(ZoneInfo("Europe/Sarajevo"))
          result=check(json.loads(Path("data.json").read_text()),today.date().isoformat())
          signal=publication_feedback(result,today)
          path=Path("collector-output/ab-publication-feedback.json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(signal,ensure_ascii=False,indent=2)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("needs_recovery="+str(not result["both_published"]).lower()+"\n")
          print("SENZOR_AB_PUBLICATION",signal["feedback"],"missing",signal["missing"])
          PY
      - name: Inspector publication recovery - retry publisher for existing approved tickets
        if: steps.gate.outputs.phase == 'publication' && steps.publication.outputs.needs_recovery == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today=datetime.now(ZoneInfo("Europe/Sarajevo")).date().isoformat()
          approval=Path("memarasix-football-ai-approved.json")
          valid=False
          if approval.exists():
              try:
                  doc=json.loads(approval.read_text(encoding="utf-8"))
                  valid=doc.get("date")==today and doc.get("approval_source")=="chatgpt_ai_analyst" and bool(doc.get("tickets"))
              except (ValueError,OSError):
                  pass
          if valid:
              subprocess.run(["gh","workflow","run","memarasix-espn-ab-publish.yml",
                              "--repo",os.environ["GH_REPO"],"--ref","main"],check=True)
              print("AB_PUBLICATION_RETRY_DISPATCHED_FOR_EXISTING_AI_APPROVAL")
          else:
              print("AB_PUBLICATION_AWAITING_AI_APPROVAL; no fabricated tickets or forced publisher run")
          PY
      - name: Inspector feedback to AI analyst for missing A/B publication
        if: steps.gate.outputs.phase == 'publication' && steps.publication.outputs.needs_recovery == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          signal=json.loads(Path("collector-output/ab-publication-feedback.json").read_text())
          title="INSPEKTOR A/B — PUBLICATION_RETRY — "+signal["date"]
          listing=subprocess.run(["gh","issue","list","--state","all","--repo",os.environ["GH_REPO"],
                                   "--search",title,"--json","title,number"],
                                  check=True,capture_output=True,text=True)
          if any(x["title"]==title for x in json.loads(listing.stdout)):
              print("AB_PUBLICATION_AI_FEEDBACK_ALREADY_SENT")
          else:
              body=("A_B_PUBLICATION_MISSING after 13:00 Sarajevo.\n"
                    "Technical verification ends upon TOP10_READY or by 13:00; do not restart ESPN, TipsterArea, or Scout.\n"
                    "Independent AI analyst: verify today's TOP10_READY and approval status, "
                    "finish missing A/B approvals if evidence supports, and commit to the existing "
                    "publisher input. If already approved but not visible on the website, "
                    "inspect publisher errors. No invented picks.\n"
                    "This GitHub issue is a feedback record, not an instantaneous ChatGPT trigger.\n"
                    "Monitor repeats each 15 minutes until both tickets are actually published.")
              subprocess.run(["gh","issue","create","--repo",os.environ["GH_REPO"],
                              "--title",title,"--body",body],check=True)
              print("AB_PUBLICATION_AI_FEEDBACK_CREATED")
          PY

      - name: Commit read-only monitor result
        if: always() && steps.gate.outputs.phase != 'idle'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in collector-output/ab-publication-check.json collector-output/ab-inspector.json collector-output/ab-publication-feedback.json collector-output/ab-preparation-feedback.json; do
            if [ -f "$f" ]; then git add -f -- "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Monitor A/B website publication status [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
