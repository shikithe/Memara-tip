name: Senzor A/B
on:
  workflow_dispatch:
  schedule:
    # UTC covers both CET and CEST. Local Sarajevo gate below enforces 10:00–12:15.
    - cron: '0,15,30,45 8-11 * * *'
permissions:
  contents: write
concurrency:
  group: memarasix-ab-publication-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sarajevo time gate — 10:00 through 12:15 every day
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo("Europe/Sarajevo"))
          allowed=(time(10, 0) <= now.time().replace(tzinfo=None) <= time(12, 15))
          enabled=(os.environ["EVENT_NAME"] == "workflow_dispatch") or allowed
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("enabled=" + ("true" if enabled else "false") + "\n")
          print("SENZOR_AB_TIME_GATE", now.isoformat(), "enabled=", enabled)
          PY
      - name: Verify publication checker behavior
        if: steps.gate.outputs.enabled == 'true'
        run: python3 -m unittest -v test_check_ab_publication.py
      - name: Verify published A/B from actual website data
        if: steps.gate.outputs.enabled == 'true'
        run: python3 check_ab_publication.py
      - name: Commit read-only monitor result
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f collector-output/ab-publication-check.json
          if ! git diff --cached --quiet; then
            git commit -m "Monitor A/B website publication status [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
