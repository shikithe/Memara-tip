name: TEST ONLY - NBA ESPN statistics (no push)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-nba-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run ESPN collector with synthetic fresh targets in temporary workspace
        run: |
          set -eu
          python -m py_compile sync_nba_free.py
          mkdir -p /tmp/memarasix-nba-test/collector-output
          cp sync_nba_free.py /tmp/memarasix-nba-test/
          cd /tmp/memarasix-nba-test
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          # TEST FIXTURE ONLY: valid athlete ID; not a live betting offer.
          payload={"generated_at_utc":datetime.now(timezone.utc).isoformat(),
                   "offers":[{"player_id":"4066261","player":"Bam Adebayo","points_line":0.0}]}
          Path("collector-output/nba-player-points.json").write_text(json.dumps(payload))
          PY
          python sync_nba_free.py --days 7 --max-summaries 15
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("collector-output/nba-free-statistics.json").read_text())
          assert d["provider"]=="espn-public-unofficial"
          assert d["target_status"]=="ok"
          assert d["target_player_count"]==1
          assert d["requested_summaries"]>0, "ESPN boxscore collection did not run"
          assert d["players_with_stats"]>0, "No player historical samples retrieved"
          print("TEST_OK",{"date":d["date_utc"],"boxscores":d["requested_summaries"],
                "players_with_stats":d["players_with_stats"],"errors":len(d["errors"])})
          PY
      - name: Upload isolated test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-free-isolated-test
          path: /tmp/memarasix-nba-test/collector-output/nba-free-statistics.json
          if-no-files-found: warn
          retention-days: 3
