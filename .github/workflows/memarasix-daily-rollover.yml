name: MemaraSix archive and clear landing
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/memarasix-daily-rollover.yml'
      - 'memarasix_daily_rollover.py'
      - 'tests/test_archive_handoff.py'
  schedule:
    # Retry around the clock; never stop at 12:30 Sarajevo.
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: memarasix-live-results
  cancel-in-progress: false
jobs:
  archive-and-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check archive handoff safety
        run: python -m unittest discover -s tests -p test_archive_handoff.py -v
      - name: Archive settled prior-day ticket and clear live tickets
        run: python memarasix_daily_rollover.py
      - name: Commit archive and fresh landing atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive.json data.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive completed individual player results [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
