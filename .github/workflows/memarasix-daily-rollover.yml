name: MemaraSix archive and clear landing
on:
  workflow_dispatch:
  schedule:
    # Retry every 15 min during 08:30-12:30 Sarajevo (both DST offsets).
    - cron: '*/15 6-11 * * *'
permissions:
  contents: write
concurrency:
  group: memarasix-daily-publication
  cancel-in-progress: false
jobs:
  archive-and-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check local rollover window
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          hm="$(TZ=Europe/Sarajevo date +%H%M)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || { [ "$hm" -ge 0830 ] && [ "$hm" -le 1230 ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: '3.11'
      - name: Archive settled prior-day ticket and clear live tickets
        if: steps.gate.outputs.enabled == 'true'
        run: python memarasix_daily_rollover.py
      - name: Commit archive and fresh landing atomically
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive.json data.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive settled tickets and reset daily landing [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
