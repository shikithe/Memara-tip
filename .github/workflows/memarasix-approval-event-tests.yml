name: MemaraSix AI-approval event publishing tests
on:
  pull_request:
    paths:
      - 'memarasix_approval_gate.py'
      - 'memarasix_1455_publish.py'
      - 'tests/test_ai_event_approval_gate.py'
      - '.github/workflows/listasix-sync.yml'
      - '.github/workflows/memarasix-scheduled-publication.yml'
      - '.github/workflows/memarasix-approval-event-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test approval-event guard and existing publication invariants
        run: |
          python3 -m unittest discover -s tests -p 'test_ai_event_approval_gate.py' -v
          python3 -m unittest -v test_memarasix_publication_gate.py test_memarasix_verified_quotes.py
          python3 -m unittest discover -s tests -p 'test_single_ai_approval_writer.py' -v
