# Two five-minute retry windows for daily fixture collection (Sarajevo local time).
name: MemaraSix - Collect candidate fixtures

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/memarasix-collector.yml'
      - 'collector.py'
      - 'memara_prepare_feed.py'
      - 'memara_rezultati_fallback.py'
  schedule:
    # Morning window 09:15-10:15 and recovery window 12:30-14:45 Sarajevo.
    # Cover both summer/winter UTC offsets; local-time gate filters actual runs.
    - cron: '*/5 7-12 * * *'

permissions:
  contents: write

concurrency:
  group: memarasix-candidate-feed
  cancel-in-progress: false

jobs:
  collect-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check scheduled local time
        id: localtime
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          local_hm="$(TZ=Europe/Sarajevo date +%H%M)"
          local_date="$(TZ=Europe/Sarajevo date +%F)"
          # Two local retry windows, both inclusive. Delayed cron runs outside
          # these windows are ignored, but a manual dispatch is always allowed.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "push" ] || { [ "$local_hm" -ge 0915 ] && [ "$local_hm" -le 1015 ]; } || { [ "$local_hm" -ge 1230 ] && [ "$local_hm" -le 1445 ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Local Sarajevo date: $local_date"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Outside 09:15-10:15 and 12:30-14:45 Sarajevo collection windows"
          fi
      - uses: actions/checkout@v4
        if: steps.localtime.outputs.enabled == 'true'
        with:
          persist-credentials: true
      - name: Skip already refreshed local day
        id: freshness
        if: steps.localtime.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today=datetime.now(ZoneInfo("Europe/Sarajevo")).date().isoformat()
          try:
              with open("collector-feed.json",encoding="utf-8") as f: doc=json.load(f)
              done=doc.get("date")==today and len(doc.get("football_candidates") or [])>0
          except (OSError,ValueError): done=False
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("needed="+str(not done).lower()+"\n")
          print("Today:",today,"collector needed:",not done)
          PY
      - uses: actions/setup-python@v5
        if: steps.localtime.outputs.enabled == 'true' && steps.freshness.outputs.needed == 'true'
        with:
          python-version: '3.11'
      - name: Collect football and NBA + regional leagues and player watchlist
        if: steps.localtime.outputs.enabled == 'true' && steps.freshness.outputs.needed == 'true'
        run: |
          python collector.py --date "$(TZ=Europe/Sarajevo date +%F)" --sport all --regional --nba-players --output collector-output/fixtures.json
      - name: Collect next Sarajevo date NBA fixtures
        if: steps.localtime.outputs.enabled == 'true' && steps.freshness.outputs.needed == 'true'
        run: |
          python collector.py --date "$(TZ=Europe/Sarajevo date -d tomorrow +%F)" --sport basketball --output collector-output/nba-next.json || echo "WARNING: next-day NBA unavailable; today football collection continues"
      - name: Install browser for Rezultati.com fallback
        if: steps.localtime.outputs.enabled == 'true' && steps.freshness.outputs.needed == 'true'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Add Rezultati.com football only when ESPN is insufficient
        if: steps.localtime.outputs.enabled == 'true' && steps.freshness.outputs.needed == 'true'
        run: |
          python memara_rezultati_fallback.py --date "$(TZ=Europe/Sarajevo date +%F)" --input collector-output/fixtures.json --output collector-output/fixtures.json --minimum 4
      - name: Validate sources and generate analyst queue
        if: steps.localtime.outputs.enabled == 'true' && steps.freshness.outputs.needed == 'true'
        run: |
          python - <<'PY'
          import json
          doc=json.load(open("collector-output/fixtures.json",encoding="utf-8"))
          if not isinstance(doc.get("fixtures"),list) or len(doc["fixtures"])==0:
              raise SystemExit("Collector returned no valid fixtures. Existing published feed remains unchanged.")
          if not any(s.get("status")=="ok" for s in doc.get("sources",[])):
              raise SystemExit("No source succeeded. Existing feed remains unchanged.")
          print("Validated:",len(doc["fixtures"]),"fixtures; errors:",len(doc.get("errors",[])))
          PY
          python memara_prepare_feed.py --input collector-output/fixtures.json --nba-next collector-output/nba-next.json --output collector-feed.json
          python memara_math.py --input collector-feed.json --output collector-feed.json
          python - <<'PY'
          import json
          from datetime import datetime,timezone,timedelta
          from zoneinfo import ZoneInfo
          d=json.load(open("collector-feed.json",encoding="utf-8"))
          today=datetime.now(ZoneInfo("Europe/Sarajevo")).date().isoformat()
          ts=datetime.fromisoformat(d["generated_at_utc"].replace("Z","+00:00"))
          assert d["date"]==today, "Wrong Sarajevo date"
          assert datetime.now(timezone.utc)-timedelta(minutes=5)<=ts<=datetime.now(timezone.utc)+timedelta(minutes=5), "Invalid generation timestamp"
          assert isinstance(d.get("football_candidates"),list) and len(d["football_candidates"])>0, "No football candidates"
          print("VALIDATED FEED",today,len(d["football_candidates"]))
          PY
      - name: Commit candidate feed only
        if: steps.localtime.outputs.enabled == 'true' && steps.freshness.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp collector-output/fixtures.json collector-raw.json
          git add collector-feed.json collector-raw.json
          if git diff --cached --quiet; then
            echo "No changes in candidate feed"
            exit 0
          fi
          git commit -m "Update MemaraSix candidate fixture feed [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always() && steps.localtime.outputs.enabled == 'true'
        with:
          name: memarasix-candidate-fixtures
          path: |
            collector-output/fixtures.json
            collector-feed.json
          if-no-files-found: ignore

# 2026-10-28 collector recovery trigger: refresh today's candidate feed before publication.
