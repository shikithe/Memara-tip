# Five-minute retry window for daily fixture collection (Sarajevo local time).
name: MemaraSix - Collect candidate fixtures

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/memarasix-collector.yml'
  schedule:
    # UTC summer: 07:15-08:15; UTC winter: 08:15-09:15.
    # Run every 5 min; local-time gate below allows only 09:15-10:15 Sarajevo.
    - cron: '*/5 7-9 * * *'

permissions:
  contents: write

concurrency:
  group: memarasix-candidate-feed
  cancel-in-progress: false

jobs:
  collect-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check scheduled local time
        id: localtime
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          local_hm="$(TZ=Europe/Sarajevo date +%H%M)"
          local_date="$(TZ=Europe/Sarajevo date +%F)"
          # Evaluate actual start time in Sarajevo; reject late runs after 10:15.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "push" ] || { [ "$local_hm" -ge 0915 ] && [ "$local_hm" -le 1015 ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Local Sarajevo date: $local_date"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Outside 09:15-10:15 Sarajevo collection window"
          fi
      - uses: actions/checkout@v4
        if: steps.localtime.outputs.enabled == 'true'
        with:
          persist-credentials: true
      - name: Skip already refreshed local day
        id: freshness
        if: steps.localtime.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today=datetime.now(ZoneInfo("Europe/Sarajevo")).date().isoformat()
          try:
              with open("collector-feed.json",encoding="utf-8") as f: doc=json.load(f)
              done=doc.get("date")==today and len(doc.get("football_candidates") or [])>0
          except (OSError,ValueError): done=False
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("needed="+str(not done).lower()+"\n")
          print("Today:",today,"collector needed:",not done)
          PY
      - uses: actions/setup-python@v5
        if: steps.localtime.outputs.enabled == 'true' && steps.freshness.outputs.needed == 'true'
        with:
          python-version: '3.11'
      - name: Collect football and NBA + regional leagues and player watchlist
        if: steps.localtime.outputs.enabled == 'true' && steps.freshness.outputs.needed == 'true'
        run: |
          python collector.py --date "$(TZ=Europe/Sarajevo date +%F)" --sport all --regional --nba-players --output collector-output/fixtures.json
      - name: Collect next Sarajevo date NBA fixtures
        if: steps.localtime.outputs.enabled == 'true' && steps.freshness.outputs.needed == 'true'
        run: |
          python collector.py --date "$(TZ=Europe/Sarajevo date -d tomorrow +%F)" --sport basketball --output collector-output/nba-next.json
      - name: Validate sources and generate analyst queue
        if: steps.localtime.outputs.enabled == 'true' && steps.freshness.outputs.needed == 'true'
        run: |
          python - <<'PY'
          import json
          doc=json.load(open("collector-output/fixtures.json",encoding="utf-8"))
          if not isinstance(doc.get("fixtures"),list) or len(doc["fixtures"])==0:
              raise SystemExit("Collector returned no valid fixtures. Existing published feed remains unchanged.")
          if not any(s.get("status")=="ok" for s in doc.get("sources",[])):
              raise SystemExit("No source succeeded. Existing feed remains unchanged.")
          print("Validated:",len(doc["fixtures"]),"fixtures; errors:",len(doc.get("errors",[])))
          PY
          python memara_prepare_feed.py --input collector-output/fixtures.json --nba-next collector-output/nba-next.json --output collector-feed.json
          python memara_math.py --input collector-feed.json --output collector-feed.json
      - name: Commit candidate feed only
        if: steps.localtime.outputs.enabled == 'true' && steps.freshness.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp collector-output/fixtures.json collector-raw.json
          git add collector-feed.json collector-raw.json
          if git diff --cached --quiet; then
            echo "No changes in candidate feed"
            exit 0
          fi
          git commit -m "Update MemaraSix candidate fixture feed [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always() && steps.localtime.outputs.enabled == 'true'
        with:
          name: memarasix-candidate-fixtures
          path: |
            collector-output/fixtures.json
            collector-feed.json
          if-no-files-found: ignore
