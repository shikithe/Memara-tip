name: MemaraSix publication readiness (read-only)
on:
  workflow_dispatch:
  schedule:
    # Sarajevo 12:00 is 10:00 UTC in summer and 11:00 UTC in winter.
    - cron: '0 10,11 * * *'
permissions:
  contents: read
concurrency:
  group: memarasix-publication-readiness
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Sarajevo
    steps:
      - name: Check local time
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          clock="$(TZ=Europe/Sarajevo date +%H:%M)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$clock" = "12:00" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Sarajevo time: $(TZ=Europe/Sarajevo date)"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: '3.11'
      - name: Run publication readiness tests
        if: steps.gate.outputs.enabled == 'true'
        run: python -m unittest -v test_memarasix_publication_gate.py
      - name: Check publication readiness without modifying tickets or bank
        if: steps.gate.outputs.enabled == 'true'
        run: python memarasix_publication_gate.py
