name: MemaraSix publish exclusively after independent AI approval
on:
  push:
    branches: [main]
    paths:
      - 'memarasix-1455-approved.json'
  workflow_dispatch:
# No cron. Publishing starts when the analyst commits an approved ticket.
# A manual dispatch is a recovery option, but the same approval guards apply.
permissions:
  contents: write
concurrency:
  group: memarasix-daily-publication
  cancel-in-progress: false
jobs:
  publish-after-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate approved file and completed ListaSix receipt
        run: |
          set -euo pipefail
          python3 memarasix_approval_gate.py --require-publishable
      - name: Run technical publication regression tests
        run: |
          python3 -m unittest -v test_memarasix_publication_gate.py test_memarasix_verified_quotes.py
          python3 -m unittest discover -s tests -p 'test_ai_event_approval_gate.py' -v
      - name: Validate and publish independently AI-approved A/B/C
        run: python3 memarasix_1455_publish.py
      - name: Commit only publisher-owned audit and tickets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data.json memarasix-1455-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "MemaraSix: publish after AI approval [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
