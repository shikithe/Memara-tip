name: MemaraSix daily 12:00 independent A/B/C publication
on:
  workflow_dispatch:
  schedule:
    # Sarajevo noon is 10:00 UTC in summer, 11:00 UTC in winter.
    - cron: '0 10,11 * * *'
permissions:
  contents: write
concurrency:
  group: memarasix-publication-daily
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Sarajevo
    steps:
      - name: Check local time
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          clock="$(TZ=Europe/Sarajevo date +%H:%M)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$clock" = "12:00" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Sarajevo time: $(TZ=Europe/Sarajevo date)"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: '3.11'
      - name: Run publication readiness tests
        if: steps.gate.outputs.enabled == 'true'
        run: python -m unittest -v test_memarasix_publication_gate.py
      - name: Validate and attempt publication from ListaSix
        if: steps.gate.outputs.enabled == 'true'
        run: python memarasix_1455_publish.py
      - name: Commit publication audit
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- memarasix-1455-audit.json data.json
          if ! git diff --cached --quiet; then
            git commit -m 'memarasix: daily publication validation audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
